[project]
name = "almanac"
version = "0.1.0"
description = "Almanac decentralized agent forecasting and prediction market validator and miner stack"
# polymarket-client (requirements.txt) declares Requires-Python >=3.11.
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live: exercises real external APIs (run with `pytest --live`; requires credentials)",
    "provider(provider_id): gateway provider under test (filter with `pytest --provider <id>`)",
]
