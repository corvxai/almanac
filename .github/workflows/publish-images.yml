name: Publish images

# Builds the two Docker Hub images multi-arch and pushes them, then syncs each
# repo's long description from docker/dockerhub/*.md.
#
# Inert until invoked: nothing publishes on a normal push. It runs only when
#   - manually dispatched (optional `tag` input for throwaway test publishes), or
#   - a `v*` git tag is pushed (real releases → X.Y.Z + latest).
# Every run also pushes a `sha-<gitsha>` tag.
#
# Required config (repo → Settings → Secrets and variables → Actions):
#   secret  DOCKERHUB_USERNAME   Docker Hub username (also the default namespace)
#   secret  DOCKERHUB_TOKEN      Docker Hub access token (Read & Write)
#   var     DOCKERHUB_NAMESPACE  optional — only if the namespace differs from the username

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra tag to publish (e.g. test, 0.1.0-rc1). Leave blank for sha-only."
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: read

# Run the JS-based actions on Node 24 instead of the deprecated Node 20 runtime
# (the actions themselves still bundle Node 20; runners default to 24 on
# 2026-06-16, this just opts in early and silences the deprecation warnings).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  publish:
    name: Build & push ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pure-Python; builds instantly for both arches. Apple-Silicon devs
          # pull this one, so keep arm64.
          - image: agent-runner
            dockerfile: docker/agent-runner.Dockerfile
            readme: docker/dockerhub/agent-runner.md
            platforms: linux/amd64,linux/arm64
          # Server-side validator: ships the cvxpy/ecos/scipy + bittensor stack,
          # which has no prebuilt arm64 wheels. Validators run on Linux amd64
          # hosts, so build amd64-only and skip the fragile QEMU source compile.
          - image: validator
            dockerfile: docker/validator.Dockerfile
            readme: docker/dockerhub/validator.md
            platforms: linux/amd64
    steps:
      - uses: actions/checkout@v4

      - name: Resolve namespace
        run: echo "NAMESPACE=${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}" >> "$GITHUB_ENV"

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      - name: Build & push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sync Docker Hub README
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.NAMESPACE }}/${{ matrix.image }}
          readme-filepath: ${{ matrix.readme }}
