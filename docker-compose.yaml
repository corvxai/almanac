# Almanac validator stack.
#
# `validator`         — orchestrator + signing proxy + Bittensor wallet.
# `agent-runner`      — built once, referenced by tag. Spawned per agent run
#                       by `validator` via /var/run/docker.sock.
#
# Run order:
#   1. Build agent-runner FOR THE ARCHITECTURE THE VALIDATOR WILL RUN ON:
#        scripts/build_images.sh agent-runner          (Linux/macOS/WSL/Git-Bash)
#        scripts/build_images.ps1 -Target agent-runner (Windows PowerShell)
#      `docker compose build agent-runner` also works, but it builds for the
#      builder's native architecture only. The validator spawns this image as
#      sibling containers, so an arm64 image built on a laptop will NOT start on
#      an amd64 server (and vice versa). The build scripts make the target
#      `--platform` explicit and warn on cross-arch builds. To pin compose
#      builds, export DOCKER_DEFAULT_PLATFORM=linux/amd64 before building.
#   2. Local gateway on host: `python scripts/run_gateway.py` (separate terminal)
#   3. Start validator (host URL, not localhost — see README Docker section):
#        GATEWAY_SERVICE_URL=http://host.docker.internal:8077 docker compose up validator
#
# The `agent-runner` service exists only to provide a `build:` target — it
# is never `up`'d. The validator launches sibling containers from its image
# tag at runtime. Do not add validator `depends_on: [agent-runner]`: with
# `profiles: [build-only]` on agent-runner, Compose omits it from the default
# project and that dependency makes the file invalid.

services:
  agent-runner:
    image: almanac/agent-runner:latest
    build:
      context: .
      dockerfile: docker/agent-runner.Dockerfile
    # Sibling containers are spawned by the validator at runtime.
    profiles: ["build-only"]

  validator:
    image: almanac/validator:latest
    build:
      context: .
      dockerfile: docker/validator.Dockerfile
    environment:
      # Central provider gateway target
      GATEWAY_SERVICE_URL: ${GATEWAY_SERVICE_URL:-http://localhost:4000}
      # Omit agent-runner log tails after each exit (default is print).
      FORECASTING_SANDBOX_RUNNER_LOGS_QUIET: ${FORECASTING_SANDBOX_RUNNER_LOGS_QUIET:-}
      # Agent provider keys passed through to the central gateway are NOT
      # set here — secrets live with the central gateway, not the validator.
    # Defence-in-depth: the validator process must not be able to gain new
    # privileges via setuid binaries. It still spawns sibling containers via
    # the docker.sock API (an API call, not a privilege escalation), so this
    # does not affect functionality. NOTE: docker.sock access remains the
    # primary privilege risk (audit C5) — this flag does not close that.
    security_opt:
      - "no-new-privileges:true"
    volumes:
      # Sibling-container spawn. Documented privilege risk (audit C5).
      - /var/run/docker.sock:/var/run/docker.sock
      # Bittensor wallet, read-only. ${HOME} resolves on Linux/macOS/WSL. On
      # native Windows PowerShell, set HOME or replace with an absolute path
      # (e.g. ${USERPROFILE}\.bittensor) — Compose does not expand ~ there.
      - ${HOME}/.bittensor:/root/.bittensor:ro
      # UDS directory: the validator-local proxy creates proxy.sock here,
      # and the validator uses docker.sock to bind-mount this same host dir
      # into each sibling agent-runner container as read-only.
      - ${ALMANAC_RUN_DIR:-./var/run/almanac}:/var/run/almanac
      # Trace storage
      - ./data:/app/data
    # So GATEWAY_SERVICE_URL=http://host.docker.internal:… reaches the host
    # (e.g. run_gateway.py on WSL) from bridge-networked containers.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # The validator container itself does NOT need the host network, but
    # does need outbound HTTPS to the central gateway. Default bridge is fine.
